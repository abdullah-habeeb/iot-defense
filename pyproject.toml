[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-defense"
version = "0.1.0"
description = "Modular IoT cyber-defense framework foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "scapy",
  "numpy",
  "pandas",
  "scikit-learn",
  "pyyaml",
  "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
