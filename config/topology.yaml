topology:
  name: "iot-home-lab"
  switch:
    name: "s1"
  hosts:
    - name: "sensor"
      ip: "10.0.0.10/24"
      role: "iot_sensor"
    - name: "camera"
      ip: "10.0.0.20/24"
      role: "smart_camera"
    - name: "smart_plug"
      ip: "10.0.0.30/24"
      role: "smart_plug"
    - name: "attacker"
      ip: "10.0.0.100/24"
      role: "attacker"
    - name: "decoy"
      ip: "10.0.0.200/24"
      role: "simulated_decoy"
