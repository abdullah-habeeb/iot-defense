topology:
  name: "iot-home-lab"
  switch:
    name: "s1"
    dpid: "0000000000000001"
  hosts:
    - name: "sensor"
      ip: "10.0.0.10/24"
      role: "iot_sensor"
    - name: "camera"
      ip: "10.0.0.20/24"
      role: "smart_camera"
    - name: "smart_plug"
      ip: "10.0.0.30/24"
      role: "smart_plug"
    - name: "attacker"
      ip: "10.0.0.100/24"
      role: "attacker"
  links:
    - "sensor:s1"
    - "camera:s1"
    - "smart_plug:s1"
    - "attacker:s1"
  traffic:
    normal_rate: 1
    malicious_rate: 1
    scan_interval_seconds: 1
