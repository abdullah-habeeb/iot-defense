topology:
  name: "iot-home-lab"
  switch:
    name: "s1"
    dpid: "0000000000000001"
  hosts:
    - name: "h1"
      ip: "10.0.0.1/24"
      role: "iot_camera"
    - name: "h2"
      ip: "10.0.0.2/24"
      role: "smart_speaker"
    - name: "h3"
      ip: "10.0.0.3/24"
      role: "gateway"
    - name: "h4"
      ip: "10.0.0.4/24"
      role: "sensor_node"
  links:
    - "h1:s1"
    - "h2:s1"
    - "h3:s1"
    - "h4:s1"
  traffic:
    normal_rate: 1
    malicious_rate: 1
    scan_interval_seconds: 1
