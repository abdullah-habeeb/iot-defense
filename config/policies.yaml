policy:
  default_action: "allow"
  suspicious_threshold: 0.75
  response_actions:
    - "allow"
    - "alert"
    - "isolate"
    - "decoy"
    - "throttle"
  isolation_timeout_seconds: 15
  logging:
    level: "INFO"
    format: "json"
  detection:
    min_unique_destination_ports: 4
    min_packet_count: 5
    min_packets_per_second: 0.5
    threat_score_threshold: 0.8
    dos_min_packets_per_second: 20.0
    dos_max_unique_destination_ports: 2
    dos_min_packet_count: 20
    brute_force_max_unique_destination_ports: 2
    brute_force_min_packet_count: 12
    brute_force_min_packets_per_second: 1.0
    brute_force_max_packets_per_second: 15.0
    # Keeps this detector out of exfiltration's territory: their
    # packet_count windows overlap ([12, inf) vs [3, 25]), and this
    # detector runs first in registry order, so without an upper bound
    # here a real exfiltration flow whose packet_count landed in that
    # overlap would be silently misclassified as brute-force regardless
    # of its much larger payloads. 200 sits with real margin above a real
    # login attempt's payload (tens of bytes) and below exfiltration's
    # (1200+).
    brute_force_max_average_packet_size: 200.0
    exfiltration_max_unique_destination_ports: 2
    exfiltration_min_packet_count: 3
    exfiltration_max_packet_count: 25
    exfiltration_min_average_packet_size: 600.0
    exploit_max_unique_destination_ports: 1
    exploit_min_packet_count: 2
    exploit_max_packet_count: 8
    # Real observed values from data/ml/controlled_flows_5class.csv put
    # normal traffic's average_packet_size at 68-119 bytes and
    # exfiltration's at 1200+; this 250-550 band sits with real margin
    # inside that gap -- packet_count/port-count alone can't separate a
    # single oversized request from an ordinary low-volume heartbeat, so
    # payload size is this detector's real discriminator.
    exploit_min_average_packet_size: 250.0
    exploit_max_average_packet_size: 550.0
  decision:
    low_threat_score_max: 0.2
    recon_decoy_score_min: 0.8
    recon_decoy_confidence_min: 0.8
    severe_threat_score_min: 0.95
    severe_confidence_min: 0.95
    dos_isolate_score_min: 0.7
    dos_isolate_confidence_min: 0.7
    brute_force_score_min: 0.65
    brute_force_confidence_min: 0.65
    exfiltration_score_min: 0.7
    exfiltration_confidence_min: 0.7
    exploit_score_min: 0.7
    exploit_confidence_min: 0.7
  stackelberg:
    payoffs:
      NORMAL:
        ALLOW:
          CONTINUE: {attacker: 1.0, defender: 8.0}
          RETREAT: {attacker: 0.0, defender: 7.0}
        ALERT:
          CONTINUE: {attacker: 0.0, defender: 6.0}
          RETREAT: {attacker: -1.0, defender: 5.0}
        DECOY:
          CONTINUE: {attacker: -2.0, defender: 3.0}
          RETREAT: {attacker: -3.0, defender: 2.0}
        ISOLATE:
          CONTINUE: {attacker: -5.0, defender: 1.0}
          RETREAT: {attacker: -6.0, defender: 0.0}
        THROTTLE:
          # A mild, unnecessary inconvenience for legitimate traffic --
          # worse than ALLOW, but less disruptive than DECOY/ISOLATE since
          # the connection still works, just slower.
          CONTINUE: {attacker: -1.0, defender: 4.0}
          RETREAT: {attacker: -2.0, defender: 3.0}
      RECONNAISSANCE_PORT_SCAN:
        ALLOW:
          CONTINUE: {attacker: 8.0, defender: -5.0}
          RETREAT: {attacker: -1.0, defender: 1.0}
        ALERT:
          CONTINUE: {attacker: 4.0, defender: 2.0}
          RETREAT: {attacker: -2.0, defender: 3.0}
        DECOY:
          CONTINUE: {attacker: -4.0, defender: 4.0}
          RETREAT: {attacker: -3.0, defender: 8.0}
        ISOLATE:
          CONTINUE: {attacker: 1.0, defender: 3.0}
          RETREAT: {attacker: -6.0, defender: 5.0}
        THROTTLE:
          # Slows the scan but gathers no intelligence the way DECOY does
          # -- a real mitigation, just a strictly worse one here.
          CONTINUE: {attacker: 0.0, defender: 4.0}
          RETREAT: {attacker: -3.0, defender: 5.0}
      DOS_FLOOD:
        ALLOW:
          CONTINUE: {attacker: 9.0, defender: -8.0}
          RETREAT: {attacker: -1.0, defender: 1.0}
        ALERT:
          CONTINUE: {attacker: 6.0, defender: -3.0}
          RETREAT: {attacker: -1.0, defender: 2.0}
        DECOY:
          CONTINUE: {attacker: 2.0, defender: -2.0}
          RETREAT: {attacker: -2.0, defender: 3.0}
        ISOLATE:
          CONTINUE: {attacker: -7.0, defender: 9.0}
          RETREAT: {attacker: -8.0, defender: 6.0}
        THROTTLE:
          # A flood is volumetric, not something a rate cap defeats the
          # way it defeats a guess-rate-limited attack like brute-force --
          # real mitigation (reduces effective attack bandwidth) but
          # nowhere near as decisive as full containment.
          CONTINUE: {attacker: -2.0, defender: 5.0}
          RETREAT: {attacker: -3.0, defender: 4.0}
      BRUTE_FORCE:
        ALLOW:
          CONTINUE: {attacker: 9.0, defender: -8.0}
          RETREAT: {attacker: -1.0, defender: 1.0}
        ALERT:
          # Alerting alone barely slows an automated credential-stuffing
          # tool -- it isn't a human who notices and stops.
          CONTINUE: {attacker: 5.0, defender: -1.0}
          RETREAT: {attacker: -2.0, defender: 3.0}
        DECOY:
          CONTINUE: {attacker: 1.0, defender: 2.0}
          RETREAT: {attacker: -3.0, defender: 4.0}
        ISOLATE:
          # Contains the attack completely, but more disruptive than this
          # attack calls for -- it also blocks the device's legitimate
          # use, not just the attacker's guesses.
          CONTINUE: {attacker: -6.0, defender: 7.0}
          RETREAT: {attacker: -7.0, defender: 6.0}
        THROTTLE:
          # The best response of any attack here: rate-limiting directly
          # defeats a brute-force attack's actual mechanism (it needs a
          # high guess rate to succeed) while the device stays reachable
          # for a legitimate user -- strictly better than ISOLATE, which
          # achieves the same containment at the cost of also blocking
          # legitimate access.
          CONTINUE: {attacker: -7.0, defender: 8.5}
          RETREAT: {attacker: -8.0, defender: 7.5}
      DATA_EXFILTRATION:
        ALLOW:
          # Worst outcome of any attack here: a full, ongoing data breach
          # rather than a temporary service disruption -- data that
          # leaves doesn't come back once the flow completes.
          CONTINUE: {attacker: 10.0, defender: -9.0}
          RETREAT: {attacker: -1.0, defender: 1.0}
        ALERT:
          # Worse than DOS_FLOOD's ALERT: a flood's alert coincides with
          # a service that can still recover mid-attack, but an alert
          # can't recall data already sent, and an automated exfil script
          # has no reason to stop on its own the way a flood's raw volume
          # might taper under load.
          CONTINUE: {attacker: 8.0, defender: -5.0}
          RETREAT: {attacker: -2.0, defender: 2.0}
        DECOY:
          # The least useful decoy of any attack here: DOS_FLOOD's decoy
          # at least diverts some load away from the real target, but
          # exfiltration's leak originates *from* the real device itself,
          # so redirecting traffic elsewhere does nothing to stop it.
          CONTINUE: {attacker: 4.0, defender: -4.0}
          RETREAT: {attacker: -1.0, defender: 1.0}
        ISOLATE:
          # Best response of any attack here: unlike isolating mid-flood
          # (which can still leave transient effects from packets already
          # in flight), severing connectivity stops a leak outright with
          # no partial-success ambiguity.
          CONTINUE: {attacker: -8.0, defender: 10.0}
          RETREAT: {attacker: -9.0, defender: 8.0}
        THROTTLE:
          # Slows the leak but doesn't stop it -- unlike brute-force,
          # where cutting the rate defeats the attack outright, any
          # ongoing exfiltration is still a breach in progress, just a
          # slower one. Meaningfully worse than ISOLATE here.
          CONTINUE: {attacker: 1.0, defender: 3.0}
          RETREAT: {attacker: -2.0, defender: 4.0}
      EXPLOIT_PAYLOAD_INJECTION:
        ALLOW:
          # A live exploit attempt reaching the real device risks genuine
          # compromise -- worse than a mere scan, though less certain
          # than an already-confirmed, ongoing breach like exfiltration,
          # since whether this particular payload would actually succeed
          # is unknown.
          CONTINUE: {attacker: 9.0, defender: -7.0}
          RETREAT: {attacker: -1.0, defender: 1.0}
        ALERT:
          # A single-shot payload doesn't wait on a human to notice --
          # logging it changes nothing about whether it already landed.
          CONTINUE: {attacker: 5.0, defender: -2.0}
          RETREAT: {attacker: -2.0, defender: 3.0}
        DECOY:
          # Best response of any attack here: redirecting captures the
          # actual payload for analysis -- real intelligence on an
          # unconfirmed exploit -- while the real device never processes
          # it, unlike reconnaissance's decoy, which only observes a scan
          # already known to be harmless probing.
          CONTINUE: {attacker: -4.0, defender: 5.0}
          RETREAT: {attacker: -3.0, defender: 9.0}
        ISOLATE:
          # Contains it completely, but a full isolation over one
          # unconfirmed payload is heavier than the uncertainty warrants,
          # and forfeits the chance to learn what the payload actually
          # does.
          CONTINUE: {attacker: -6.0, defender: 6.0}
          RETREAT: {attacker: -7.0, defender: 5.0}
        THROTTLE:
          # Rate has nothing to do with a single malformed request -- a
          # real but essentially irrelevant mitigation here.
          CONTINUE: {attacker: -1.0, defender: 1.0}
          RETREAT: {attacker: -2.0, defender: 2.0}
  ppo:
    # model_path/fallback_policy document the convention every real call
    # site (train_ppo.py's own default output path, harness.py,
    # demo/controller.py) already follows by hand -- unlike
    # training_timesteps/environment_episode_length/reward below, these
    # two are not read from this file by any code.
    model_path: "models/ppo_defense"
    fallback_policy: "stackelberg"
    # Raised from 768 after adding the fifth scenario (data exfiltration):
    # at 768 timesteps PPO occasionally disagreed with the rule-based and
    # Stackelberg policies specifically on exfiltration (picking DECOY
    # instead of ISOLATE) even though it converged correctly on every
    # other scenario -- 3000 timesteps (still ~12s to train) resolved it.
    # Genuinely read by simulation/train_ppo.py -- editing this value
    # changes what a bare `train_ppo` run actually does.
    training_timesteps: 3000
    # Read by train_ppo.py, floored at len(TRAINING_SCENARIOS()) there
    # regardless of what's configured here -- a shorter episode silently
    # starves the last-cycled scenario of any training signal at all (see
    # DefenseDecisionEnv's own docstring for the non-convergence bug this
    # caused once already).
    environment_episode_length: 6
    reward:
      attack_contained: 5.0
      attacker_diverted: 4.0
      intelligence_gained: 3.0
      service_preserved: 3.0
      successful_compromise: -6.0
      false_positive_intervention: -4.0
      unnecessary_isolation: -3.0
      service_disruption: -3.0
      response_cost: -0.5
