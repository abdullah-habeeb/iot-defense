policy:
  default_action: "allow"
  suspicious_threshold: 0.75
  response_actions:
    - "allow"
    - "alert"
    - "isolate"
    - "decoy"
    - "throttle"
    - "block_source"
    - "quarantine"
    - "reset_sessions"
    - "forensic_capture"
    - "bandwidth_cap"
  isolation_timeout_seconds: 15
  logging:
    level: "INFO"
    format: "json"
  detection:
    min_unique_destination_ports: 4
    min_packet_count: 5
    min_packets_per_second: 0.5
    threat_score_threshold: 0.8
    dos_min_packets_per_second: 20.0
    dos_max_unique_destination_ports: 2
    dos_min_packet_count: 20
    brute_force_max_unique_destination_ports: 2
    brute_force_min_packet_count: 12
    brute_force_min_packets_per_second: 1.0
    brute_force_max_packets_per_second: 15.0
    # Keeps this detector out of exfiltration's territory: their
    # packet_count windows overlap ([12, inf) vs [3, 25]), and this
    # detector runs first in registry order, so without an upper bound
    # here a real exfiltration flow whose packet_count landed in that
    # overlap would be silently misclassified as brute-force regardless
    # of its much larger payloads. 200 sits with real margin above a real
    # login attempt's payload (tens of bytes) and below exfiltration's
    # (1200+).
    brute_force_max_average_packet_size: 200.0
    exfiltration_max_unique_destination_ports: 2
    exfiltration_min_packet_count: 3
    exfiltration_max_packet_count: 25
    exfiltration_min_average_packet_size: 600.0
    exploit_max_unique_destination_ports: 1
    exploit_min_packet_count: 2
    exploit_max_packet_count: 8
    # Real observed values from data/ml/controlled_flows_5class.csv put
    # normal traffic's average_packet_size at 68-119 bytes and
    # exfiltration's at 1200+; this 250-550 band sits with real margin
    # inside that gap -- packet_count/port-count alone can't separate a
    # single oversized request from an ordinary low-volume heartbeat, so
    # payload size is this detector's real discriminator.
    exploit_min_average_packet_size: 250.0
    exploit_max_average_packet_size: 550.0
  decision:
    low_threat_score_max: 0.2
    recon_decoy_score_min: 0.8
    recon_decoy_confidence_min: 0.8
    severe_threat_score_min: 0.95
    severe_confidence_min: 0.95
    dos_isolate_score_min: 0.7
    dos_isolate_confidence_min: 0.7
    brute_force_score_min: 0.65
    brute_force_confidence_min: 0.65
    exfiltration_score_min: 0.7
    exfiltration_confidence_min: 0.7
    exploit_score_min: 0.7
    exploit_confidence_min: 0.7
  # The single operator objective every policy optimizes and every evaluation
  # is scored against. It is NOT derived from any attack's registered
  # preferred_action -- no policy, training signal, or metric reads that
  # field as ground truth for response quality. The realized utility of one
  # response is
  #   containment*(1 - residual_attack_fraction)   [attack conditions only]
  # + service*(1 - legit_service_loss)
  # + intelligence*(intel_verified)                [attack conditions only]
  # - action_cost[action]
  # where residual_attack_fraction, legit_service_loss and intel_verified are
  # MEASURED in live Mininet (evaluation/outcome.py), and action_cost is the
  # operator's declared operational cost of running that response (it does
  # not depend on any outcome).
  objective:
    containment: 5.0
    service: 3.0
    intelligence: 2.0
    action_cost:
      ALLOW: 0.0
      ALERT: 0.1
      FORENSIC_CAPTURE: 0.3
      BANDWIDTH_CAP: 0.3
      BLOCK_SOURCE: 0.3
      THROTTLE: 0.4
      RESET_SESSIONS: 0.4
      DECOY: 0.5
      QUARANTINE: 0.7
      ISOLATE: 1.0
  # The Stackelberg arm's world model: an a-priori, mechanism-based prior
  # about what each response can physically do against each class of attack,
  # written from how the mechanisms work (rate-limit rules throttle
  # connection floods but cannot stop a single oversized payload; a source
  # block at the target does not stop device-initiated outbound traffic; a
  # redirect only helps if the attacker keeps talking to the target; ...).
  # It is NOT fitted to, and never consults, any measured outcome or any
  # registered preferred_action. Where this prior is wrong about reality, the
  # measured evaluation exposes it -- that gap is the point of keeping the
  # arms independent. Payoffs are built from these priors plus the shared
  # objective above by defense/game_model.py; the leader/follower solve is
  # unchanged.
  game_model:
    attacker:
      gain: 5.0              # value to the attacker of an uncontained attack
      exposure_penalty: 2.0  # cost to the attacker of continuing against a response that contains it
    attack_class:
      reconnaissance_port_scan: probing
      dos_flood: flood
      brute_force: credential
      data_exfiltration: outbound
      exploit_payload_injection: payload
      tcp_syn_flood: flood
      icmp_ping_flood: flood
      slow_loris_exhaustion: exhaustion
      dns_amplification: reflection
      dns_tunneling_exfiltration: outbound
      mqtt_message_flood: exhaustion
      firmware_tampering: outbound
      buffer_overflow_probe: payload
      credential_replay: credential
      rogue_config_beacon: outbound
      c2_beaconing: outbound
      dos_flood_distributed: distributed_flood
      tcp_syn_flood_distributed: distributed_flood
      icmp_ping_flood_distributed: distributed_flood
      credential_replay_distributed: distributed_trickle
    # Distributed classes: one attack spread over ~6 source addresses. A
    # per-source response (BLOCK_SOURCE, DECOY, BANDWIDTH_CAP, keyed on the
    # identified source) reaches about one source in six; a destination-keyed
    # rate limit still caps the aggregate but only above its rate (so it does
    # nothing to a slow trickle); a default-deny allowlist drops every source
    # it does not already know. These are first-principles estimates written
    # before any distributed measurement.
    # Prior probability that the action neutralizes the attack's effect on
    # the protected device, per attack class. Classes absent from an
    # action's map default to 0.0.
    containment_prior:
      ISOLATE: {probing: 1.0, flood: 1.0, exhaustion: 1.0, credential: 1.0, payload: 1.0, outbound: 1.0, reflection: 1.0, distributed_flood: 1.0, distributed_trickle: 1.0}
      QUARANTINE: {probing: 0.95, flood: 0.95, exhaustion: 0.95, credential: 0.95, payload: 0.95, outbound: 0.9, reflection: 0.95, distributed_flood: 0.9, distributed_trickle: 0.9}
      BLOCK_SOURCE: {probing: 0.95, flood: 0.95, exhaustion: 0.95, credential: 0.95, payload: 0.9, outbound: 0.3, reflection: 0.95, distributed_flood: 0.15, distributed_trickle: 0.15}
      THROTTLE: {probing: 0.5, flood: 0.8, exhaustion: 0.7, credential: 0.6, payload: 0.15, outbound: 0.1, reflection: 0.3, distributed_flood: 0.8, distributed_trickle: 0.0}
      RESET_SESSIONS: {probing: 0.0, flood: 0.05, exhaustion: 0.5, credential: 0.2, payload: 0.5, outbound: 0.2, reflection: 0.0, distributed_flood: 0.0, distributed_trickle: 0.0}
      DECOY: {probing: 0.9, flood: 0.3, exhaustion: 0.5, credential: 0.6, payload: 0.8, outbound: 0.2, reflection: 0.2, distributed_flood: 0.1, distributed_trickle: 0.1}
      BANDWIDTH_CAP: {probing: 0.1, flood: 0.4, exhaustion: 0.1, credential: 0.1, payload: 0.05, outbound: 0.0, reflection: 0.8, distributed_flood: 0.15, distributed_trickle: 0.15}
    # Prior fraction of legitimate service lost while the action is active.
    service_loss_prior:
      ISOLATE: 1.0
      QUARANTINE: 0.35
      THROTTLE: 0.25
      RESET_SESSIONS: 0.15
      DECOY: 0.05
    # Prior probability the action yields verified intelligence (a decoy
    # interaction, a non-empty evidence capture) when an attack is present.
    intelligence_prior:
      DECOY: 0.8
      FORENSIC_CAPTURE: 0.9
  ppo:
    model_path: "models/ppo_defense"
    # The PPO arm learns from MEASURED outcomes only: the live-Mininet
    # outcome table built by evaluation/outcome_table.py (every attack x
    # every action, repeated), never from registry preferred_action. Each
    # training step draws a true condition, shows the policy a noisy,
    # sometimes mislabelled detector observation of it, and rewards the
    # chosen action with a measured realized utility sampled for the TRUE
    # condition -- so it must learn how much to trust a label.
    outcome_table_path: "data/outcomes/outcome_table.jsonl"
    training_timesteps: 120000
    environment_episode_length: 68
    label_error_rate: 0.15
    score_noise_sigma: 0.07
    feature_jitter: 0.2
    # Utilities are divided by this (the objective's maximum attainable
    # utility, containment + service + intelligence) so rewards are O(1).
    reward_scale: 10.0
